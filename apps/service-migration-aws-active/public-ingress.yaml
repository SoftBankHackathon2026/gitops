apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: service-receipt
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:974402993422:certificate/28b7fc3d-bb93-4811-ab2b-055b1dcbf30e
    alb.ingress.kubernetes.io/load-balancer-name: ghost-service-migration
spec:
  ingressClassName: alb
  rules:
  - host: service-migration.hackerthon.yubin.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-receipt
            port:
              number: 80
