apiVersion: v1
kind: Service
metadata:
  name: openbao
  labels:
    app: openbao
spec:
  type: ClusterIP
  selector:
    app: openbao
  ports:
    - name: http
      port: 8200
      targetPort: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-internal
  labels:
    app: openbao
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: openbao
  ports:
    - name: http
      port: 8200
      targetPort: 8200
    - name: cluster
      port: 8201
      targetPort: 8201
