apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  labels:
    app: openbao
spec:
  serviceName: openbao-internal
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: quay.io/openbao/openbao:2.7.2
          # 이미지 entrypoint 가 /openbao/config 디렉터리를 -config 로 넘긴다. 파일을 또 주면 중복 경고.
          args: ["server"]
          env:
            - name: BAO_ADDR
              value: http://127.0.0.1:8200
            - name: SKIP_SETCAP
              value: "true"
            - name: SKIP_CHOWN
              value: "true"
          ports:
            - name: http
              containerPort: 8200
            - name: cluster
              containerPort: 8201
          readinessProbe:
            # sealed(503)·uninitialized(501) 도 Ready 로 본다. init/unseal 을 서비스로 해야 하기 때문
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /openbao/config
              readOnly: true
            - name: data
              mountPath: /openbao/data
            - name: seal
              mountPath: /openbao/seal
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: openbao-config
        # static seal 키(32바이트). Git 에 두지 않고 README 절차로 만든 Secret 을 쓴다. fsGroup 1000 이 읽도록 0440.
        - name: seal
          secret:
            secretName: openbao-static-seal
            defaultMode: 0440
            items:
              - key: static.key
                path: static.key
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
