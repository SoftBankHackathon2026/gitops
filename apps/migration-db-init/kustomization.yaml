# 온프렘 init_db 설정 ConfigMap (온프렘 k3s, hackathon 네임스페이스).
# job-aws.manual.yaml·apps/migration-return/job-precheck.manual.yaml 이 ConfigMap migration-db-init 을 쓴다.
# Argo CD Application: argocd/onprem/migration-db-init.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackathon
commonLabels:
  app.kubernetes.io/part-of: migration
resources:
  - configmap.yaml
  # job.manual.yaml 은 일부러 넣지 않는다(2026-11-08). 온프렘 migration_demo 를 삭제했고, sync 로 이 Job 이
  # 돌면 그 DB 를 다시 만든다. 역할 복구 때만 파일 머리말대로 kubectl create -f 로 만든다.
  # secret.example.yaml 은 일부러 넣지 않는다. 값은 팀원이 kubectl 로 만든다 (README.md).
images:
  - name: ghcr.io/softbankhackathon2026/migration-tools
    # 자리표시자. Hackathon 저장소 migration/ 의 CI 가 커밋 SHA 로 바꾸거나, 사람이 고정한다.
    newTag: 8ab45a3c824252e2dab5469b0165f9c931244878
