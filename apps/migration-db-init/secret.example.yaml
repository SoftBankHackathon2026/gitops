# 예시 파일이다. kustomization.yaml 에 넣지 않았고 Argo CD 도 읽지 않는다.
# 실제 값은 저장소에 두지 않는다. 팀원이 클러스터에서 직접 만든다 (README.md 의 명령).
#
# 네 키 모두 있어야 한다 — migration-db-init Job, migration-cdc(cdc·sink), db-insert-worker(app)가 참조한다.
apiVersion: v1
kind: Secret
metadata:
  name: migration-db-credentials
  namespace: hackathon
type: Opaque
stringData:
  app_password: REPLACE_ME      # migration_app    — INSERT 워커
  cdc_password: REPLACE_ME      # migration_cdc    — Debezium PG Source (replication)
  sink_password: REPLACE_ME     # migration_sink   — Debezium JDBC Sink (대상 DB 쓰기)
  verify_password: REPLACE_ME   # migration_verify — 검증 도구 (읽기 전용)
