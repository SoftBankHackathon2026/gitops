# 초기화 도구에 넘기는 비밀 아닌 설정. 비밀번호는 Secret 으로 따로 들어간다 (job.yaml).
#
# 이 ConfigMap 은 훅이 아닌 일반 리소스이기도 하다. Argo CD 는 훅(Job)을 diff 대상에서 빼므로,
# 이 파일이 없으면 Application 에 "동기화할 것"이 없어 자동 sync 가 한 번도 안 돌 수 있다.
# 여기 값을 바꾸면 sync 가 일어나고 Job 이 다시 돈다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-db-init
data:
  # 도구가 MIGRATION_CONFIG 로 읽는 설정. 스키마는 Hackathon/migration/config.example.yaml 과 같다.
  # 슈퍼유저 이름(users.admin.user)은 Secret review-db-credentials 의 username 과 같아야 한다.
  config.yaml: |
    # 이전 도구 공통 설정 예시. 비밀번호는 절대 이 파일에 적지 않는다.
    # 각 계정의 비밀번호는 아래 `password_env`에 적힌 환경변수에서 읽는다.

    targets:
      onprem:
        host: postgres            # k3s 네임스페이스 hackathon 안의 기존 플랫폼 Postgres 16
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres    # CREATE DATABASE 용 유지보수 DB
        users:
          admin:
            # 기존 플랫폼 Postgres 의 슈퍼유저. Secret review-db-credentials 의 username 과 같다.
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      aws:
        # 미확정. oneaction-infra 가 RDS 주소를 정하면 바꾼다 (k3s→AWS 사설 경로도 그때 확정).
        host: REPLACE_WITH_AWS_DB_HOST
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: postgres
            password_env: MIGRATION_AWS_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

    job:
      job_id: forward_001
      source: onprem
      target: aws
      table: public.migration_demo
      # 전환 후 워커가 새 요청에 붙이는 phase
      live_phase_before: onprem_live
      live_phase_after: aws_live

    kafka:
      bootstrap_servers: kafka:9092       # 기존 플랫폼 Kafka 3.9.1, PLAINTEXT
      connect_url: http://migration-connect:8083
      # 커넥터 비밀번호는 Connect 의 EnvVarConfigProvider(${env:MIGRATION_*_PASSWORD})로 주입한다.
      # gitops apps/migration-cdc 가 config.providers=env 와 Secret 환경변수를 설정한다.
      # secrets_file 은 FileConfigProvider 를 쓰는 환경을 위한 선택값이며 기본 템플릿은 쓰지 않는다.
      secrets_file: /opt/kafka/secrets/migration.properties

    worker:
      url: http://db-insert-worker:8080   # gitops apps/db-insert-worker 의 Service 이름
      state_dir: /var/lib/worker

    cutover:
      state_dir: /var/lib/worker
      min_live_rows_after_snapshot: 100
      min_rows_after_switch: 100
      offset_stable_seconds: 10
      poll_interval_seconds: 5
      stage_timeout_seconds: 1800
