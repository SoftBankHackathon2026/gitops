apiVersion: apps/v1
kind: Deployment
metadata:
  name: durable-ingress
spec:
  template:
    spec:
      containers:
        - name: ingress
          command: [node, -e]
          args:
            - >-
              if (require('./src/durable-ingress/service').HANDOFF_PROTOCOL_VERSION !== 1)
              throw new Error('HANDOFF_IMAGE_REQUIRED');
              require('./src/durable-ingress/server');
          env:
            - name: INGRESS_FORWARD_TARGETS
              value: '{"aws_receipt":{"url":"https://service-migration.hackerthon.yubin.dev","token_env":"CLOUD_INGRESS_API_TOKEN"}}'
            - name: CLOUD_INGRESS_API_TOKEN
              valueFrom:
                secretKeyRef: {name: service-migration-auth, key: api-token}
            # Handoff APIs require auth even though ordinary legacy controls
            # could be protected by NetworkPolicy alone.
            - name: INGRESS_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: durable-ingress-control, key: token, optional: false}
