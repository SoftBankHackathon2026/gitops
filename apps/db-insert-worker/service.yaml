# 워커 제어·관측 포트. 전환 도구가 /status 를 읽고, Prometheus 가 있으면 /metrics 를 긁는다.
apiVersion: v1
kind: Service
metadata:
  name: db-insert-worker
  labels:
    app.kubernetes.io/name: db-insert-worker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: db-insert-worker
  ports:
    - {name: http, port: 8080, targetPort: http}
