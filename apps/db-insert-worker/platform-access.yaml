# Oneport 플랫폼 수집기(AWS EKS)가 Tailscale 경로로 워커 상태(GET /status)를 읽도록 노드 포트를 연다.
# 워커는 local-path PV 때문에 k3s-master 에 고정이라 수집기는 http://172.30.1.10:30880 을 본다.
# 노드 포트는 LAN(172.30.1.0/24)과 그 경로를 받은 tailnet 에서만 닿는다. 공유기에서 외부로 열지 않는다.
# 플랫폼 설정: Hackathon platform/deploy/aws/fleet.json 의 worker_url
apiVersion: v1
kind: Service
metadata:
  name: db-insert-worker-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: db-insert-worker
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30880}
---
# default-deny-ingress 위에 노드 포트 경로만 연다.
#   172.30.1.0/24 : LAN, 그리고 AWS 에서 온 트래픽(proxmox-exit 가 SNAT)
#   10.42.N.0/32, 10.42.N.1/32 : 다른 노드로 들어와 kube-proxy 가 SNAT 한 경우의 노드 주소(flannel.1, cni0)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-worker-status
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: db-insert-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 172.30.1.0/24}
        - ipBlock: {cidr: 10.42.0.0/32}
        - ipBlock: {cidr: 10.42.0.1/32}
        - ipBlock: {cidr: 10.42.1.0/32}
        - ipBlock: {cidr: 10.42.1.1/32}
      ports:
        - {port: 8080, protocol: TCP}
