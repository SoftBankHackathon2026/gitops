# AWS → 온프렘 귀환 설정. 비밀번호는 여기 없다 (password_env 이름만 적고 Job 이 Secret 에서 넣는다).
# 스키마와 내용은 Hackathon/migration/config.return.example.yaml 과 같다.
# 정방향 설정(apps/db-insert-worker, apps/migration-db-init 의 ConfigMap)은 건드리지 않고 따로 둔다.
#
# 귀환 규칙
# - seed 를 다시 넣지 않는다. 원본은 정방향 이후 데이터가 쌓인 현재 AWS 다.
# - 대상은 정방향 원본(migration_demo)과 분리된 빈 DB(migration_demo_return)다.
# - job_id return_001 에서 slot·publication·커넥터·토픽 이름이 만들어진다.
#   이름 규칙이 달라 정방향(forward_001) offset 을 재사용하지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-return-config
data:
  config.yaml: |
    # AWS → 온프렘 귀환 설정. 비밀번호는 절대 이 파일에 적지 않는다.

    targets:
      aws:
        # 미확정. oneaction-infra 가 RDS 주소를 정하면 바꾼다 (k3s→AWS 사설 경로도 그때 확정).
        host: REPLACE_WITH_AWS_DB_HOST
        port: 5432
        dbname: migration_demo
        sslmode: require                  # RDS 파라미터 rds.force_ssl=1
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin         # oneaction-infra RDS 마스터 계정
            password_env: MIGRATION_AWS_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc           # 귀환 원본 CDC 계정. RDS 에서는 rds_replication 역할 필요
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      onprem_return:
        host: postgres                    # k3s hackathon 네임스페이스의 플랫폼 Postgres 16 (정방향 원본과 같은 인스턴스)
        port: 5432
        dbname: migration_demo_return     # 정방향 원본 migration_demo 와 분리된 빈 귀환 대상
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin         # 온프렘 Postgres 슈퍼유저 (Secret review-db-credentials 의 username)
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

    job:
      job_id: return_001                  # slot return_001, publication return_001_pub, 커넥터 return_001-source/-sink
      source: aws
      target: onprem_return
      table: public.migration_demo
      live_phase_before: aws_live
      live_phase_after: onprem_return_live

    kafka:
      bootstrap_servers: kafka:9092       # 기존 플랫폼 Kafka 3.9.1, PLAINTEXT
      connect_url: http://migration-connect:8083
      secrets_file: /opt/kafka/secrets/migration.properties

    worker:
      url: http://db-insert-worker:8080   # gitops apps/db-insert-worker 의 Service 이름
      state_dir: /var/lib/worker

    cutover:
      state_dir: /var/lib/worker
      min_live_rows_after_snapshot: 100
      min_rows_after_switch: 100
      offset_stable_seconds: 10
      poll_interval_seconds: 5
      stage_timeout_seconds: 1800
