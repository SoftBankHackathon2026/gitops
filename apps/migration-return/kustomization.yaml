# AWS → 온프렘 귀환 설정과 귀환 대상 초기화 (온프렘 k3s, hackathon 네임스페이스).
# Argo CD Application: argocd/onprem/migration-return.yaml (수동 sync)
#
# Kafka Connect 는 따로 띄우지 않고 apps/migration-cdc 를 재사용한다.
# 데이터 토픽은 scripts/create-migration-topic.sh 에 TOPIC_PREFIX=return_001 을 주어 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackathon
commonLabels:
  app.kubernetes.io/part-of: migration
resources:
  - configmap.yaml
  - job-init-target.yaml
  # job-precheck.manual.yaml 은 일부러 넣지 않는다. 점검은 sync 와 무관하게 필요할 때 kubectl create -f 로
  # 돌리는 일이고, 손으로 만드는 Secret migration-return-aws-admin 이 없으면 sync 까지 실패하기 때문이다.
images:
  - name: ghcr.io/softbankhackathon2026/migration-tools
    # 자리표시자. Hackathon 저장소 migration/ 의 CI 가 커밋 SHA 로 바꾸거나, 사람이 고정한다.
    newTag: main
