# Secret service-migration-auth 를 Secrets Manager 에서 동기화한다 (oneaction-infra infra/eks-service-migration).
# 값은 Git 에 없다. ESO 전용 인스턴스 external-secrets-service-migration 이 Pod Identity 로 읽는다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: service-migration
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: service-migration-auth
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: service-migration
  target:
    name: service-migration-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: api-token
    remoteRef:
      key: oneaction/service-migration
      property: api_token
  - secretKey: control-token
    remoteRef:
      key: oneaction/service-migration
      property: control_token
  # EKS 앱의 기존 요청 API 토큰과 같은 값이어야 한다. 복사하지 않고 같은 비밀 속성을 읽는다.
  - secretKey: app-token
    remoteRef:
      key: oneaction/sample-app
      property: request_api_token
