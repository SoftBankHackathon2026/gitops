# 에이전트 1개. 표준 라이브러리 파이썬이라 새 이미지 없이 migration-tools 이미지 + ConfigMap 스크립트로 돈다.
#
# Secret demo-traffic-agent 는 운영자가 만든다(값은 GitOps 에 넣지 않는다):
#   agent_key          GKE Secret demo-traffic-control-keys 의 agent_key 와 같은 값
#   bot_control_token  traffic-bot 의 BOT_CONTROL_TOKEN 과 같은 값(봇 이미지가 스위치를 지원한 뒤 쓰인다)
#
# 워커 PVC 를 붙여 cutover.sqlite3 로 "전환 진행 중" 잠금을 판단한다. 에이전트는 SQLite 를 mode=ro 로만
# 연다. 마운트 자체를 readOnly 로 하지 않는 이유: WAL 모드 DB 는 다른 프로세스가 열고 있지 않으면 -shm 을
# 만들 수 있어야 열린다(읽기 전용 마운트에서는 unable to open database file → 늘 잠금).
# RWO local-path 라 워커와 같은 노드에 둔다(live-db-cutover 러너와 같은 방식).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-traffic-agent
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: demo-traffic-agent}
  template:
    metadata:
      labels: {app: demo-traffic-agent}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: db-insert-worker
              topologyKey: kubernetes.io/hostname
      containers:
        - name: agent
          image: ghcr.io/softbankhackathon2026/migration-tools:1d80b61d08f05f91886369f7b973ab176e751503
          command: [python, -I, /opt/agent/agent.py]
          env:
            # GKE oneaction-dev demo-traffic-control LoadBalancer. Service 를 다시 만들면 바뀐다.
            - {name: CONTROL_URL, value: "http://34.64.248.107"}
            - name: AGENT_KEY
              valueFrom:
                secretKeyRef: {name: demo-traffic-agent, key: agent_key}
            - name: BOT_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: demo-traffic-agent, key: bot_control_token, optional: true}
            - {name: WORKER_URL, value: "http://db-insert-worker:8080"}
            - {name: BOT_CONTROL_URL, value: "http://traffic-bot-control:9091"}
            - {name: CONNECT_URL, value: "http://migration-connect:8083"}
            - {name: CUTOVER_DB, value: /var/lib/worker/cutover.sqlite3}
          volumeMounts:
            - {name: script, mountPath: /opt/agent, readOnly: true}
            - {name: state, mountPath: /var/lib/worker}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: script
          configMap: {name: demo-traffic-agent-script}
        - name: state
          persistentVolumeClaim:
            claimName: db-insert-worker-state
