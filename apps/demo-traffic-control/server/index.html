<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데모 트래픽 제어</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #5c6370; --line: #dde1e7;
    --run: #1a7f4b; --run-bg: #e3f4ea; --stop: #6b7280; --stop-bg: #eceef1;
    --warn: #9a5b00; --warn-bg: #fff3dc; --bad: #b42318; --bad-bg: #fde8e6; --accent: #2457d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --panel: #1a1d23; --text: #e8eaee; --muted: #9aa1ad; --line: #2c3139;
      --run: #4fd18b; --run-bg: #173325; --stop: #a3a9b3; --stop-bg: #23272e;
      --warn: #f2b24c; --warn-bg: #3a2c12; --bad: #ff7b6e; --bad-bg: #3d1a17; --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 600; }
  .pill.ok { background: var(--run-bg); color: var(--run); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.off { background: var(--stop-bg); color: var(--stop); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; background: var(--warn-bg);
    color: var(--warn); }
  .banner[hidden] { display: none; }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .card h2 { font-size: 17px; margin: 0; }
  .role { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .state { font-size: 26px; font-weight: 700; margin: 4px 0 10px; }
  .state.running { color: var(--run); } .state.stopped { color: var(--stop); }
  .state.unknown { color: var(--warn); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 14px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  .note { font-size: 13px; color: var(--muted); min-height: 20px; margin: 0 0 10px; }
  .buttons { display: flex; gap: 8px; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 18px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .key { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px;
    margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .key input { flex: 1 1 240px; min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  h3 { font-size: 15px; margin: 24px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>데모 트래픽 제어</h1>
  <p class="sub">온프렘의 두 봇이 새 요청을 만들지 여부를 켜고 끕니다. 이미 만든 요청은 끝까지 보냅니다.</p>

  <div class="bar">
    <span id="agent" class="pill off">에이전트 확인 중</span>
    <span id="clock" class="sub" style="margin:0"></span>
  </div>

  <div id="lock" class="banner" hidden>
    <strong>지금은 켜고 끌 수 없습니다.</strong>
    <ul id="lock-reasons"></ul>
  </div>

  <div class="grid">
    <section class="card" data-target="worker">
      <h2>INSERT 워커</h2>
      <p class="role">DB 에 직접 쓰는 내부 시스템</p>
      <div class="state unknown">확인 중</div>
      <dl></dl>
      <p class="note"></p>
      <div class="buttons">
        <button class="primary" data-action="start">시작</button>
        <button data-action="stop">멈춤</button>
      </div>
    </section>
    <section class="card" data-target="bot">
      <h2>traffic-bot</h2>
      <p class="role">HTTP 로 들어오는 사용자 요청 (접수 큐 경유)</p>
      <div class="state unknown">확인 중</div>
      <dl></dl>
      <p class="note"></p>
      <div class="buttons">
        <button class="primary" data-action="start">시작</button>
        <button data-action="stop">멈춤</button>
      </div>
    </section>
  </div>

  <div class="key">
    <label for="operator-key">운영자 키</label>
    <input id="operator-key" type="password" autocomplete="off"
      placeholder="이 탭에만 저장되고 전송되지 않습니다 (서명에만 사용)">
    <button id="forget-key">지우기</button>
  </div>

  <h3>최근 명령</h3>
  <div class="scroll">
    <table>
      <thead><tr><th>시각</th><th>대상</th><th>명령</th><th>결과</th></tr></thead>
      <tbody id="commands"><tr><td colspan="4">없음</td></tr></tbody>
    </table>
  </div>
</main>
<script src="/hmac.js"></script>
<script src="/app.js"></script>
</body>
</html>
