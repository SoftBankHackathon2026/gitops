# sample-app k8s/traffic-bot/bot.yaml (commit 51d1b03) 을 온프렘용으로 옮긴 것. 차이: BOT_API_TOKEN 제거.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traffic-bot-ledger
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: traffic-bot
  template:
    metadata:
      labels:
        app: traffic-bot
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9091'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traffic-bot
          image: docker.io/kty1021/sample-app
          command: [node, packages/traffic-bot/bin/traffic-bot.js]
          env:
            - name: BOT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: traffic-bot-target
                  key: base-url
            # 2026-11-08 커밋 여부 미확인(unknown) 요청이 남은 원장은 /data/ledger 에 보관하고 새 원장으로 시작한다.
            # 2026-11-08 10:31 두 번째 원장(/data/ledger-20261108)도 보관한다. 쓰기가 닫힌 DB 앞에서 접수만 된 56건을
            # 운영자가 접수 큐에서 지웠기 때문에, 그 장부에는 끝나지 않는 처리 중 56건이 남는다.
            - name: BOT_LEDGER_DIR
              value: /data/ledger-20261108-2
            # 팀 INSERT 워커의 forward_NNN·return_NNN 과 겹치지 않게 한다. ledger 를 잃었으면 새 run_id 로 시작한다.
            - name: BOT_RUN_ID
              value: ghost_bot_sqlite_20261108_2
            # 새 원장은 자동 생성하지 않는다. 러너가 예산을 정해 시작하고 완료 후 정지한다.
            # 기존 원장의 영속 생성 상태는 새 이미지가 복구한다.
            - name: BOT_GENERATION
              value: stopped
            - name: BOT_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-traffic-agent
                  key: bot_control_token
            - name: BOT_PHASE
              value: onprem_return_live
            - name: BOT_MAX_RECORDS
              value: '100000'
            - name: BOT_MAX_LEDGER_BYTES
              value: '67108864'
            - name: BOT_RATE
              value: '1'
            - name: BOT_METRICS_PORT
              value: '9091'
          ports:
            - name: metrics
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            initialDelaySeconds: 20
          volumeMounts:
            - name: ledger
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: traffic-bot-ledger
