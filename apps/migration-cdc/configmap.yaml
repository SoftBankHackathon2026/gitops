# Kafka Connect 워커 설정. Debezium Connect 이미지의 환경변수 계약을 따른다.
#   GROUP_ID·*_STORAGE_TOPIC·KEY_CONVERTER·HEAP_OPTS 는 이미지가 이름 그대로 받고,
#   CONNECT_<이름> 은 접두어를 떼고 소문자·'_'→'.' 로 바꿔 connect-distributed.properties 에 넣는다.
#   예: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR → config.storage.replication.factor
#   ⚠️ 값에 '@' 가 들어가면 이미지의 sed 치환이 깨진다 (이미지 README).
#
# 비밀번호는 여기 없다. deployment.yaml 이 Secret 에서 MIGRATION_*_PASSWORD 로 넣고,
# 커넥터 설정은 ${env:MIGRATION_CDC_PASSWORD} 처럼 config provider 로 참조한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-connect
data:
  # 네임스페이스 안의 Kafka (KRaft, PLAINTEXT, 무인증, 브로커 2개)
  BOOTSTRAP_SERVERS: kafka:9092
  GROUP_ID: migration-connect
  # 내부 토픽. Connect 가 compaction 으로 직접 만든다. 브로커가 2개라 복제 계수 2.
  CONFIG_STORAGE_TOPIC: migration-connect-configs
  OFFSET_STORAGE_TOPIC: migration-connect-offsets
  STATUS_STORAGE_TOPIC: migration-connect-status
  CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "2"
  CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "2"
  CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "2"
  # Debezium 이벤트와 key 의 스키마를 보존한다 (JDBC Sink 가 스키마를 필요로 한다).
  KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
  CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
  CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
  # 커넥터 설정에서 환경변수를 ${env:이름} 으로 참조한다. MIGRATION_ 으로 시작하는 것만 허용.
  CONNECT_CONFIG_PROVIDERS: env
  CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: ^MIGRATION_.*
  # REST 는 모든 인터페이스에 바인드. 광고 주소는 deployment.yaml 이 파드 IP 로 넣는다.
  REST_HOST_NAME: 0.0.0.0
  # JVM 힙. 컨테이너 메모리 상한 1.5Gi 안에 들어가야 한다 (deployment.yaml).
  HEAP_OPTS: -Xms512m -Xmx1g
  LOG_LEVEL: INFO
