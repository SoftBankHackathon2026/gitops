# Oneport 플랫폼 수집기(AWS EKS)가 Tailscale 경로로 커넥터 상태(GET /connectors/<job>-(source|sink)/status)를 읽도록
# 노드 포트를 연다. 플랫폼 설정: Hackathon platform/deploy/aws/fleet.json 의 connect_url (두 노드 주소)
#
# externalTrafficPolicy: Local 이라 Connect 파드가 있는 노드만 응답한다. Connect 는 어느 노드에서든 뜰 수 있어
# 수집기가 두 노드 주소를 차례로 시도하고, 응답한 주소를 다음 수집부터 먼저 쓴다.
# Kafka Connect REST 는 인증이 없다. 노드 포트는 LAN·tailnet 에서만 닿게 두고 공유기에서 외부로 열지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: migration-connect-external
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: migration-connect
  ports:
    - {name: http, port: 8083, targetPort: http, nodePort: 30883}
---
# 출발지 범위의 이유는 apps/db-insert-worker/platform-access.yaml 과 같다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-connect-status
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: migration-connect
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 172.30.1.0/24
            except: [172.30.1.10/32, 172.30.1.7/32]
      ports:
        - {port: 8083, protocol: TCP}
