apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-migration
resources:
- settings.yaml
- kafka.yaml
- connect.yaml
- runner.yaml
- networkpolicy.yaml
configMapGenerator:
- name: cloud-migration-rds-ca
  files:
  - root.crt=rds-ca.pem
- name: cloud-migration-config
  files:
  - config.yaml=config.cloud.yaml
