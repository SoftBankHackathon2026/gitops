apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-migration
resources:
- settings.yaml
- kafka.yaml
- connect.yaml
- runner.yaml
- networkpolicy.yaml
- redis.yaml
- ingress.yaml
- traffic-bot.yaml
- copy-job.yaml
- initialize-job.yaml
- approve-job.yaml
configMapGenerator:
- name: cloud-migration-rds-ca
  files:
  - root.crt=rds-ca.pem
- name: cloud-migration-config
  files:
  - config.yaml=config.cloud.yaml
- name: cloud-control
  files:
  - control/adapter.py
  - control/ingress.js
