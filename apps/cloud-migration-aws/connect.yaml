apiVersion: v1
kind: Service
metadata:
  name: cloud-connect
spec:
  selector:
    app: cloud-connect
  ports:
  - port: 8083
    targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-connect
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloud-connect
  template:
    metadata:
      labels:
        app: cloud-connect
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: connect
        image: ghcr.io/softbankhackathon2026/migration-connect:67005b5ea644787d6641e0b9648436f0be8db389
        env:
        - name: BOOTSTRAP_SERVERS
          value: cloud-kafka:9092
        - name: GROUP_ID
          value: cloud-migration-aws
        - name: CONFIG_STORAGE_TOPIC
          value: aws_cloud_configs
        - name: OFFSET_STORAGE_TOPIC
          value: aws_cloud_offsets
        - name: STATUS_STORAGE_TOPIC
          value: aws_cloud_status
        - name: CONFIG_STORAGE_REPLICATION_FACTOR
          value: '1'
        - name: OFFSET_STORAGE_REPLICATION_FACTOR
          value: '1'
        - name: STATUS_STORAGE_REPLICATION_FACTOR
          value: '1'
        - name: KEY_CONVERTER
          value: org.apache.kafka.connect.json.JsonConverter
        - name: VALUE_CONVERTER
          value: org.apache.kafka.connect.json.JsonConverter
        - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
          value: 'true'
        - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
          value: 'true'
        - name: CONNECT_CONFIG_PROVIDERS
          value: env
        - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
          value: org.apache.kafka.common.config.provider.EnvVarConfigProvider
        - name: CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN
          value: ^MIGRATION_(AWS|GCP)_(CDC|SINK)_PASSWORD$
        - name: HEAP_OPTS
          value: -Xms256m -Xmx768m
        - name: REST_HOST_NAME
          value: 0.0.0.0
        - name: ADVERTISED_HOST_NAME
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: MIGRATION_AWS_CDC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-migration-connect-credentials
              key: aws_cdc_password
        - name: MIGRATION_AWS_SINK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-migration-connect-credentials
              key: aws_sink_password
        - name: MIGRATION_GCP_CDC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-migration-connect-credentials
              key: gcp_cdc_password
        - name: MIGRATION_GCP_SINK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-migration-connect-credentials
              key: gcp_sink_password
        volumeMounts:
        - name: rds-ca
          mountPath: /kafka/.postgresql
          readOnly: true
        ports:
        - containerPort: 8083
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: &id001
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 768Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /
            port: 8083
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /connectors
            port: 8083
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8083
          timeoutSeconds: 5
          periodSeconds: 30
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2@sha256:fc224915ef435afeb5b2a9421260a0d31986d5c8b7c7f5783c7f5d5885700cd2
        args:
        - --address=127.0.0.1
        - --port=5432
        - --credentials-file=/gcp/credentials.json
        - --health-check
        - --http-address=0.0.0.0
        - --http-port=9801
        - $(CLOUD_SQL_INSTANCE)
        env:
        - name: CLOUD_SQL_INSTANCE
          valueFrom:
            configMapKeyRef:
              name: cloud-migration-settings
              key: CLOUD_SQL_INSTANCE
        volumeMounts:
        - name: gcp-auth
          mountPath: /gcp
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id001
          readOnlyRootFilesystem: true
        readinessProbe:
          httpGet:
            path: /readiness
            port: 9801
        livenessProbe:
          httpGet:
            path: /liveness
            port: 9801
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: gcp-auth
        secret:
          secretName: cloud-migration-gcp-auth
          defaultMode: 288
      - name: rds-ca
        configMap:
          name: cloud-migration-rds-ca
      nodeSelector:
        kubernetes.io/arch: amd64
