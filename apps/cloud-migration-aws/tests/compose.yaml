# Disposable local Kafka/Connect smoke, no DB connections or real credentials.
services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: Q2xvdWRNaWdyYXRpb25BVw
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_DEFAULT_REPLICATION_FACTOR: '1'
      KAFKA_NUM_PARTITIONS: '1'
      KAFKA_LOG_DIRS: /tmp/aws-test-data/logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
    - kafka-data:/tmp/aws-test-data
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null
      interval: 5s
      timeout: 10s
      retries: 30
  connect:
    image: ghcr.io/softbankhackathon2026/migration-connect:67005b5ea644787d6641e0b9648436f0be8db389
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cloud-migration-aws
      CONFIG_STORAGE_TOPIC: aws_cloud_configs
      OFFSET_STORAGE_TOPIC: aws_cloud_offsets
      STATUS_STORAGE_TOPIC: aws_cloud_status
      CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      STATUS_STORAGE_REPLICATION_FACTOR: '1'
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'true'
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'true'
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: ^MIGRATION_(AWS|GCP)_(CDC|SINK)_PASSWORD$
      HEAP_OPTS: -Xms256m -Xmx768m
      REST_HOST_NAME: 0.0.0.0
      ADVERTISED_HOST_NAME: connect
    ports:
    - 127.0.0.1::8083
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8083/connectors >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
    platform: linux/amd64
volumes:
  kafka-data: {}
