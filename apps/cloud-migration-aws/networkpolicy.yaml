apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloud-migration-isolation
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: &id001
    - podSelector:
        matchLabels:
          app: cloud-connect
    - podSelector:
        matchLabels:
          app: cloud-runner
    - podSelector:
        matchLabels:
          app: cloud-kafka
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
    - protocol: TCP
      port: 8083
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to: *id001
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
    - protocol: TCP
      port: 8083
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 3307
    - protocol: TCP
      port: 5432
