apiVersion: batch/v1
kind: Job
metadata:
  name: cloud-migration-copy-002
spec:
  suspend: false
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: cloud-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: runner
        image: ghcr.io/softbankhackathon2026/migration-tools:cb3a99cb3a7b7b567627f9472c181a68aca467a0
        command:
        - python
        - /opt/cloud-control/adapter.py
        env:
        - name: PGSSLROOTCERT
          value: /db-ca/root.crt
        - name: MIGRATION_AWS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-migration-runner-credentials
              key: aws_admin_password
        - name: MIGRATION_AWS_VERIFY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-migration-runner-credentials
              key: aws_verify_password
        - name: MIGRATION_GCP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-migration-runner-credentials
              key: gcp_admin_password
        - name: MIGRATION_GCP_VERIFY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloud-migration-runner-credentials
              key: gcp_verify_password
        - name: CLOUD_APP_TARGETS
          valueFrom:
            configMapKeyRef:
              name: cloud-migration-settings
              key: CLOUD_APP_TARGETS
        - name: INGRESS_CONTROL_URL
          value: http://cloud-ingress-control:9092
        - name: INGRESS_CONTROL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloud-ingress-auth
              key: control-token
        - name: AWS_REQUEST_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloud-ingress-auth
              key: aws-token
        - name: GCP_REQUEST_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloud-ingress-auth
              key: gcp-token
        volumeMounts:
        - name: rds-ca
          mountPath: /db-ca
          readOnly: true
        - name: config
          mountPath: /etc/cloud-migration
          readOnly: true
        - name: state
          mountPath: /var/lib/worker
        - name: tmp
          mountPath: /tmp
        - name: cloud-control
          mountPath: /opt/cloud-control
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: &id001
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 5Gi
        args:
        - run
      volumes:
      - name: gcp-auth
        secret:
          secretName: cloud-migration-gcp-auth
          defaultMode: 288
      - name: rds-ca
        configMap:
          name: cloud-migration-rds-ca
      - name: config
        configMap:
          name: cloud-migration-config
      - name: state
        persistentVolumeClaim:
          claimName: cloud-migration-state
      - name: tmp
        emptyDir:
          sizeLimit: 4Gi
      - name: cloud-control
        configMap:
          name: cloud-control
      nodeSelector:
        kubernetes.io/arch: amd64
      restartPolicy: Never
      initContainers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2@sha256:fc224915ef435afeb5b2a9421260a0d31986d5c8b7c7f5783c7f5d5885700cd2
        args:
        - --address=127.0.0.1
        - --port=5432
        - --credentials-file=/gcp/credentials.json
        - --health-check
        - --http-address=0.0.0.0
        - --http-port=9801
        - $(CLOUD_SQL_INSTANCE)
        env:
        - name: CLOUD_SQL_INSTANCE
          valueFrom:
            configMapKeyRef:
              name: cloud-migration-settings
              key: CLOUD_SQL_INSTANCE
        volumeMounts:
        - name: gcp-auth
          mountPath: /gcp
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id001
          readOnlyRootFilesystem: true
        readinessProbe:
          httpGet:
            path: /readiness
            port: 9801
        livenessProbe:
          httpGet:
            path: /liveness
            port: 9801
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        restartPolicy: Always
        startupProbe:
          httpGet:
            path: /readiness
            port: 9801
          periodSeconds: 5
          failureThreshold: 36
