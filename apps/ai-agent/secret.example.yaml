# 예시다. kustomization 에 넣지 않고 값을 커밋하지 않는다. 값은 파일에서 읽어 직접 만든다.
#
#   kubectl -n hackathon create secret generic ai-agent-credentials \
#     --from-file=CODEX_API_KEY=/secure/codex-api-key
#   # Slack 보고를 쓰면 --from-file=SLACK_BOT_TOKEN=/secure/slack-bot-token 을 더한다 (없어도 된다)
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-credentials
  namespace: hackathon
type: Opaque
stringData:
  CODEX_API_KEY: REPLACE_ME
  # SLACK_BOT_TOKEN: REPLACE_ME
