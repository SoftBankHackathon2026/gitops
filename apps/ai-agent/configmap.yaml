# 비밀값은 여기 두지 않는다. deployment.yaml 이 Secret 에서 환경변수로 넣는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
data:
  agent.yaml: |
    job_id: onprem_agent_001
    state_dir: /var/lib/agent
    auto_apply: true
    smoke:
      stage: pre_cutover
      # 온프렘에 CDC 커넥터가 없어 대상 앱 DB 조회만 본다. 복제·쓰기는 검증하지 않고 보고에 그렇게 적는다.
      target_only: true
      target_url: http://sample-app-smoke.hackathon.svc.cluster.local
    policy:
      opa_url: http://migration-policy.hackathon.svc.cluster.local:8181
    plan:
      source: aws
      target: onprem
      approved_locations: [busan-local]
      limits:
        evidence_ttl_seconds: 300
        write_wait_max_seconds: 30
      target_db:
        host: postgres.hackathon.svc.cluster.local
        port: 5432
    # SEC-01·SEC-02 수집기가 없어 사실을 선언한다. OPA 입력의 source 가 agent.declared-config 로 드러난다.
    declared_evidence:
      target_db_exposure:
        public: false
        target_id: k8s:hackathon/postgres
      target_location:
        location: busan-local
        target_id: k8s:hackathon/postgres
    # addr·mount·path 는 Secret ai-agent-store 의 값이 환경변수로 들어와 우선한다.
    openbao:
      addr: http://openbao.hackathon.svc.cluster.local:8200
      mount: secret
      path: hackathon/sample-app/onprem
      token_env: VAULT_TOKEN
    codex:
      runner: sidecar
      shared_dir: /work
      timeout: 300
      # 필수다. 없으면 에이전트가 시작하지 않는다 (내장 기본 모델은 도구 목록이 비어 파일을 못 읽는다).
      model: gpt-5.5
    probe:
      sslmode: verify-full
      sslrootcert: /db-ca/ca.pem
      password_url_env: SAMPLE_APP_DATABASE_URL
    restart:
      namespace: hackathon
      rollout: sample-app
      selector: app=sample-app
      timeout: 180
