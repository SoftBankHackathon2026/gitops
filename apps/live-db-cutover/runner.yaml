# Dedicated cutover process: controls the HTTP bot and ingress; no DB insert worker API.
# 러너 프로세스는 플랫폼 보고기다. --all-jobs 로 플랫폼에 등록된 모든 작업의 전환 명령을 오래된 순서로 하나씩
# 받아, config.yaml 의 targets 는 그대로 두고 job 절만 그 작업으로 바꾼 설정(/var/lib/worker/jobs/<job>.yaml)으로
# migration.cutover 를 실행한다. 상태 파일에 기록이 있는 작업은 5초마다 모두 보고한다.
# 운영자는 kubectl exec 로 이 컨테이너에서 migration.cutover 를 직접 실행한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-db-cutover
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: live-db-cutover}
  template:
    metadata:
      labels: {app: live-db-cutover}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # local-path PVC의 PV nodeAffinity가 배치 노드를 결정한다.
      containers:
        - name: runner
          image: ghcr.io/softbankhackathon2026/migration-tools:251db8c6d2f71fdbde6d0b557c837cd178d1bf51
          command: [python, /opt/reporter/fleet_reporter.py]
          args: [--all-jobs, --state-dir, /var/lib/worker, --interval, "5", --execute-commands]
          env:
            - {name: MIGRATION_CONFIG, value: /etc/live-cutover/config.yaml}
            - {name: ONEPORT_PLATFORM_URL, value: https://platform.yubin.dev}
            - name: ONEPORT_INGEST_TOKEN
              valueFrom:
                secretKeyRef: {name: oneport-ingest, key: token}
            - name: MIGRATION_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: password}
            - name: MIGRATION_AWS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-aws-admin, key: password}
            - name: MIGRATION_APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-db-credentials, key: app_password}
            - name: MIGRATION_CDC_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-db-credentials, key: cdc_password}
            - name: MIGRATION_SINK_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-db-credentials, key: sink_password}
            - name: MIGRATION_VERIFY_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-db-credentials, key: verify_password}
            # 봇과 같은 제어 토큰. 키가 없으면 실행하지 않아 완료 후 정지 실패를 막는다.
            - name: BOT_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: demo-traffic-agent, key: bot_control_token}
            # 접수 서비스 제어 API 토큰 (apps/durable-ingress 와 같은 Secret).
            - name: INGRESS_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: durable-ingress-control, key: token}
            # 실행 정책 게이트(Hackathon migration/CUTOVER_POLICY.md). 이미지 1d80b61 은 COPYING·FENCING·SWITCHING
            # 경계마다 OPA 판정을 받는다. 증거 경로는 보고기가 작업마다 state/policy/<job>.json 으로 정하고,
            # 대상이 CUTOVER_POLICY_COLLECTORS 에 있으면 cutover 가 경계마다 증거를 직접 새로 만든다.
            # 손으로 리허설할 때는 kubectl exec 에서 CUTOVER_POLICY_EVIDENCE=... 를 직접 준다.
            - {name: POLICY_OPA_URL, value: "http://migration-policy:8181"}
            - {name: CUTOVER_POLICY_COLLECTORS, value: /etc/live-cutover/policy-collectors.json}
            # RDS DescribeDBInstances 하나만 허용한 증거 수집 전용 키. 사람 계정 자격증명이 아니다.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: migration-runner-evidence, key: access_key_id, optional: true}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: migration-runner-evidence, key: secret_access_key, optional: true}
          volumeMounts:
            - {name: config, mountPath: /etc/live-cutover, readOnly: true}
            - {name: state, mountPath: /var/lib/worker}
            - {name: tmp, mountPath: /tmp}
            - {name: reporter, mountPath: /opt/reporter, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: live-db-cutover-config}
        - name: state
          persistentVolumeClaim: {claimName: db-insert-worker-state}
        - name: tmp
          emptyDir: {}
        - name: reporter
          configMap: {name: oneport-fleet-reporter}
