# Dedicated process: heavy cutover/verification must not block worker probes.
# 러너 프로세스는 플랫폼 보고기다. 5초마다 cutover 상태를 플랫폼(platform.yubin.dev)으로 보낸다.
# 🔴 --execute-commands 는 끈 상태다. 정리·리허설 동안 플랫폼 화면의 전환 명령(시작·승인·중단 등)이
#    운영자 실행과 겹치지 않게 하려는 것이다. 다시 켤 때는 args 끝에 --execute-commands 를 되돌린다.
# 운영자는 kubectl exec 로 이 컨테이너에서 migration.cutover 를 직접 실행한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-db-cutover
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: live-db-cutover}
  template:
    metadata:
      labels: {app: live-db-cutover}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: db-insert-worker
              topologyKey: kubernetes.io/hostname
      containers:
        - name: runner
          image: ghcr.io/softbankhackathon2026/migration-tools:1d80b61d08f05f91886369f7b973ab176e751503
          command: [python, /opt/reporter/fleet_reporter.py]
          args: [--job-id, durable_forward_001, --state-dir, /var/lib/worker, --interval, "5"]
          env:
            - {name: MIGRATION_CONFIG, value: /etc/live-cutover/config.yaml}
            - {name: ONEPORT_PLATFORM_URL, value: https://platform.yubin.dev}
            - name: ONEPORT_INGEST_TOKEN
              valueFrom:
                secretKeyRef: {name: oneport-ingest, key: token}
            - name: MIGRATION_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: review-db-credentials, key: password}
            - name: MIGRATION_AWS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-aws-admin, key: password}
            - name: MIGRATION_APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-db-credentials, key: app_password}
            - name: MIGRATION_CDC_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-db-credentials, key: cdc_password}
            - name: MIGRATION_SINK_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-db-credentials, key: sink_password}
            - name: MIGRATION_VERIFY_PASSWORD
              valueFrom:
                secretKeyRef: {name: migration-db-credentials, key: verify_password}
            # 접수 서비스 제어 API 토큰 (apps/durable-ingress 와 같은 Secret). 없으면 NetworkPolicy 만으로 보호.
            - name: INGRESS_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: durable-ingress-control, key: token, optional: true}
          volumeMounts:
            - {name: config, mountPath: /etc/live-cutover, readOnly: true}
            - {name: state, mountPath: /var/lib/worker}
            - {name: tmp, mountPath: /tmp}
            - {name: reporter, mountPath: /opt/reporter, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: live-db-cutover-config}
        - name: state
          persistentVolumeClaim: {claimName: db-insert-worker-state}
        - name: tmp
          emptyDir: {}
        - name: reporter
          configMap: {name: oneport-fleet-reporter}
