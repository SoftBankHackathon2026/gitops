apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackathon
resources:
  - configmap.yaml
  - backend.yaml
  - runner.yaml
configMapGenerator:
  - name: live-db-rds-trust
    files: [rds-ca.pem]
  # 플랫폼 보고기. 원본은 Hackathon 레포 platform/deploy/onprem/fleet_reporter.py
  - name: oneport-fleet-reporter
    files: [fleet_reporter.py]
