apiVersion: v1
kind: ConfigMap
metadata:
  name: live-db-cutover-config
data:
  config.yaml: |
    # 이전 도구 공통 설정 예시. 비밀번호는 절대 이 파일에 적지 않는다.
    # 각 계정의 비밀번호는 아래 `password_env`에 적힌 환경변수에서 읽는다.

    targets:
      onprem:
        host: postgres            # k3s 네임스페이스 hackathon 안의 기존 플랫폼 Postgres 16
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres    # CREATE DATABASE 용 유지보수 DB
        users:
          admin:
            # 기존 플랫폼 Postgres 의 슈퍼유저. Secret review-db-credentials 의 username 과 같다.
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      onprem_return:
        # AWS→온프렘 귀환 대상. 정방향 원본(migration_demo)과 같은 인스턴스의 분리된 빈 DB.
        # 접수 큐의 onprem 경로가 이 DB를 사용하는 sample-app을 가리킨다.
        host: postgres
        port: 5432
        dbname: migration_demo_return
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      rehearsal:
        # AWS 가 없을 때 전체 사이클(CDC → Sink → 전환 → 검증)을 돌리는 리허설 대상.
        # 정방향 원본과 같은 인스턴스의 분리된 빈 DB. RDS 가 생기면 aws 로 같은 절차를 반복한다.
        host: postgres
        port: 5432
        dbname: migration_demo_rehearsal
        sslmode: require
        admin_dbname: postgres
        kind: self_managed
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      aws:
        # 미확정. oneaction-infra 가 RDS 주소를 정하면 바꾼다 (k3s→AWS 사설 경로도 그때 확정).
        host: oneaction-review-db.cdb6j7l51obe.ap-northeast-2.rds.amazonaws.com
        kind: rds                 # RDS: REPLICATION 속성 대신 rds_replication 역할. init_db·cutover 가 참고한다
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin     # oneaction-infra RDS 마스터 계정
            password_env: MIGRATION_AWS_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

    job:
      job_id: bot_forward_001                       # 새 봇 제어 흐름: 과거 COMPLETED job_id 재사용 금지
      source: onprem_return            # 2026-11-06 귀환 뒤 실제 라이브 DB (migration_demo_return)
      target: aws
      table: public.migration_demo
      # 이전 이력의 단계 이름. 봇 요청은 기존 불변 필드를 유지한다.
      live_phase_before: onprem_return_live
      live_phase_after: aws_live

    kafka:
      bootstrap_servers: kafka:9092       # 기존 플랫폼 Kafka 3.9.1, PLAINTEXT
      connect_url: http://migration-connect:8083
      # 커넥터 비밀번호는 Connect 의 EnvVarConfigProvider(${env:MIGRATION_*_PASSWORD})로 주입한다.
      # gitops apps/migration-cdc 가 config.providers=env 와 Secret 환경변수를 설정한다.
      # secrets_file 은 FileConfigProvider 를 쓰는 환경을 위한 선택값이며 기본 템플릿은 쓰지 않는다.
      secrets_file: /opt/kafka/secrets/migration.properties

    # HTTP 봇은 DB에 직접 쓰지 않고 고정된 접수 큐로 요청한다.
    bot:
      control_url: http://traffic-bot-control:9091
      token_env: BOT_CONTROL_TOKEN
      request_endpoint: http://durable-ingress.hackathon.svc.cluster.local/api/requests
      timeout_seconds: 15

    cutover:
      state_dir: /var/lib/worker
      min_live_rows_after_snapshot: 100
      min_rows_after_switch: 100
      offset_stable_seconds: 10
      poll_interval_seconds: 5
      stage_timeout_seconds: 1800

    # 원본과 대상 앱의 DB 이름을 확인한 뒤 큐만 전환한다. 봇의 HTTP 주소는 바꾸지 않는다.
    ingress:
      control_url: http://durable-ingress-control.hackathon.svc.cluster.local:9092
      token_env: INGRESS_CONTROL_TOKEN
      targets:
        onprem_return: onprem
        aws: aws_db
        rehearsal: rehearsal
      app_checks:
        onprem_return:
          url: http://sample-app.hackathon.svc.cluster.local
          environment: onprem
          database: migration_demo_return
        aws:
          url: http://sample-app-rds.hackathon.svc.cluster.local
          environment: local
          database: migration_demo
        rehearsal:
          url: http://sample-app-rehearsal.hackathon.svc.cluster.local
          environment: rehearsal
          database: migration_demo_rehearsal

  # 귀환용 설정. 러너 컨테이너에서 --config /etc/live-cutover/config.return-durable.yaml 사용.

  config.return-durable.yaml: |
    targets:
      onprem:
        host: postgres
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      onprem_return:
        host: postgres
        port: 5432
        dbname: migration_demo_return
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      rehearsal:
        host: postgres
        port: 5432
        dbname: migration_demo_rehearsal
        sslmode: require
        admin_dbname: postgres
        kind: self_managed
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      aws:
        host: oneaction-review-db.cdb6j7l51obe.ap-northeast-2.rds.amazonaws.com
        kind: rds
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_AWS_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
    job:
      job_id: bot_return_001
      source: aws
      target: onprem_return
      table: public.migration_demo
      live_phase_before: aws_live
      live_phase_after: onprem_return_live
    kafka:
      bootstrap_servers: kafka:9092
      connect_url: http://migration-connect:8083
      secrets_file: /opt/kafka/secrets/migration.properties
    # HTTP 봇은 DB에 직접 쓰지 않고 고정된 접수 큐로 요청한다.
    bot:
      control_url: http://traffic-bot-control:9091
      token_env: BOT_CONTROL_TOKEN
      request_endpoint: http://durable-ingress.hackathon.svc.cluster.local/api/requests
      timeout_seconds: 15
    cutover:
      state_dir: /var/lib/worker
      min_live_rows_after_snapshot: 100
      min_rows_after_switch: 100
      offset_stable_seconds: 10
      poll_interval_seconds: 5
      stage_timeout_seconds: 1800

    # 원본과 대상 앱의 DB 이름을 확인한 뒤 큐만 전환한다. 봇의 HTTP 주소는 바꾸지 않는다.
    ingress:
      control_url: http://durable-ingress-control.hackathon.svc.cluster.local:9092
      token_env: INGRESS_CONTROL_TOKEN
      targets:
        onprem_return: onprem
        aws: aws_db
        rehearsal: rehearsal
      app_checks:
        onprem_return:
          url: http://sample-app.hackathon.svc.cluster.local
          environment: onprem
          database: migration_demo_return
        aws:
          url: http://sample-app-rds.hackathon.svc.cluster.local
          environment: local
          database: migration_demo
        rehearsal:
          url: http://sample-app-rehearsal.hackathon.svc.cluster.local
          environment: rehearsal
          database: migration_demo_rehearsal

  # 리허설(AWS 없이): 현재 라이브 DB(onprem_return)에서 같은 Postgres 의 migration_demo_rehearsal 로
  # 트래픽봇·CDC·DB 권한·접수 큐를 cutover 도구가 제어한다. 러너 파드에서
  #   python -m migration.cutover --config /etc/live-cutover/config.rehearsal-durable.yaml --state-dir /var/lib/worker run
  # 전제: migration_demo_rehearsal 은 비어 있어야 한다(11-05 rehearsal_001 잔존 행은 먼저 비운다).
  # 되돌리기: 리허설 뒤 라이브를 onprem_return 으로 되돌리려면 접수 서비스 /target onprem 과 원본 GRANT 를
  # 운영자가 되돌린다(리허설 중 리허설 DB 에 들어간 합성 행은 그대로 둔다).
  config.rehearsal-durable.yaml: |
    targets:
      onprem:
        host: postgres
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      onprem_return:
        host: postgres
        port: 5432
        dbname: migration_demo_return
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      rehearsal:
        host: postgres
        port: 5432
        dbname: migration_demo_rehearsal
        sslmode: require
        admin_dbname: postgres
        kind: self_managed
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      aws:
        host: oneaction-review-db.cdb6j7l51obe.ap-northeast-2.rds.amazonaws.com
        kind: rds
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_AWS_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
    job:
      job_id: bot_rehearsal_001       # 새 흐름의 별도 작업 이력
      source: onprem_return
      target: rehearsal
      table: public.migration_demo
      live_phase_before: onprem_return_live
      live_phase_after: rehearsal_live
    kafka:
      bootstrap_servers: kafka:9092
      connect_url: http://migration-connect:8083
      secrets_file: /opt/kafka/secrets/migration.properties
    # HTTP 봇은 DB에 직접 쓰지 않고 고정된 접수 큐로 요청한다.
    bot:
      control_url: http://traffic-bot-control:9091
      token_env: BOT_CONTROL_TOKEN
      request_endpoint: http://durable-ingress.hackathon.svc.cluster.local/api/requests
      timeout_seconds: 15
    cutover:
      state_dir: /var/lib/worker
      min_live_rows_after_snapshot: 100
      min_rows_after_switch: 100
      offset_stable_seconds: 10
      poll_interval_seconds: 5
      stage_timeout_seconds: 1800
    # 원본과 대상 앱의 DB 이름을 확인한 뒤 큐만 전환한다. 봇의 HTTP 주소는 바꾸지 않는다.
    ingress:
      control_url: http://durable-ingress-control.hackathon.svc.cluster.local:9092
      token_env: INGRESS_CONTROL_TOKEN
      targets:
        onprem_return: onprem
        aws: aws_db
        rehearsal: rehearsal
      app_checks:
        onprem_return:
          url: http://sample-app.hackathon.svc.cluster.local
          environment: onprem
          database: migration_demo_return
        aws:
          url: http://sample-app-rds.hackathon.svc.cluster.local
          environment: local
          database: migration_demo
        rehearsal:
          url: http://sample-app-rehearsal.hackathon.svc.cluster.local
          environment: rehearsal
          database: migration_demo_rehearsal
  # 정책 증거 수집 설정 (대상 이름별). 보고기가 작업 대상에 맞는 항목을 작업별 파일로 만들어 cutover 에 넘긴다.
  # cutover 는 정책 경계마다 RDS(읽기 전용 조회)와 대상 앱 /api/info 를 관측해 그 작업의 증거를 새로 쓴다. 비밀값은 없다.
  policy-collectors.json: |
    {
      "aws": {
        "identifier": "oneaction-review-db",
        "region": "ap-northeast-2",
        "approved_locations": [
          "ap-northeast-2"
        ],
        "app_url": "https://sample-app.hackerthon.yubin.dev",
        "app_environment": "aws",
        "evidence_ttl_seconds": 60,
        "write_wait_max_seconds": 300
      }
    }
