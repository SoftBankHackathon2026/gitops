apiVersion: v1
kind: ConfigMap
metadata:
  name: live-db-cutover-config
data:
  config.yaml: |
    # 이전 도구 공통 설정 예시. 비밀번호는 절대 이 파일에 적지 않는다.
    # 각 계정의 비밀번호는 아래 `password_env`에 적힌 환경변수에서 읽는다.

    targets:
      onprem:
        host: postgres            # k3s 네임스페이스 hackathon 안의 기존 플랫폼 Postgres 16
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres    # CREATE DATABASE 용 유지보수 DB
        users:
          admin:
            # 기존 플랫폼 Postgres 의 슈퍼유저. Secret review-db-credentials 의 username 과 같다.
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      onprem_return:
        # AWS→온프렘 귀환 대상. 정방향 원본(migration_demo)과 같은 인스턴스의 분리된 빈 DB.
        # 귀환 cutover 가 워커 /target 으로 이 이름을 보내므로 여기 없으면 SWITCHING 에서 NEEDS_RECOVERY 가 된다.
        host: postgres
        port: 5432
        dbname: migration_demo_return
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      rehearsal:
        # AWS 가 없을 때 전체 사이클(CDC → Sink → 전환 → 검증)을 돌리는 리허설 대상.
        # 정방향 원본과 같은 인스턴스의 분리된 빈 DB. RDS 가 생기면 aws 로 같은 절차를 반복한다.
        host: postgres
        port: 5432
        dbname: migration_demo_rehearsal
        sslmode: require
        admin_dbname: postgres
        kind: self_managed
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      aws:
        # 미확정. oneaction-infra 가 RDS 주소를 정하면 바꾼다 (k3s→AWS 사설 경로도 그때 확정).
        host: oneaction-review-db.cdb6j7l51obe.ap-northeast-2.rds.amazonaws.com
        kind: rds                 # RDS: REPLICATION 속성 대신 rds_replication 역할. init_db·cutover 가 참고한다
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin     # oneaction-infra RDS 마스터 계정
            password_env: MIGRATION_AWS_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

    job:
      job_id: durable_forward_001                   # 실제 영속접수 경로를 사용한 온프렘→AWS DB 이전 시험
      source: onprem_return            # 2026-11-06 귀환 뒤 실제 라이브 DB (migration_demo_return)
      target: aws
      table: public.migration_demo
      # 전환 후 워커가 새 요청에 붙이는 phase
      live_phase_before: onprem_return_live
      live_phase_after: aws_live

    kafka:
      bootstrap_servers: kafka:9092       # 기존 플랫폼 Kafka 3.9.1, PLAINTEXT
      connect_url: http://migration-connect:8083
      # 커넥터 비밀번호는 Connect 의 EnvVarConfigProvider(${env:MIGRATION_*_PASSWORD})로 주입한다.
      # gitops apps/migration-cdc 가 config.providers=env 와 Secret 환경변수를 설정한다.
      # secrets_file 은 FileConfigProvider 를 쓰는 환경을 위한 선택값이며 기본 템플릿은 쓰지 않는다.
      secrets_file: /opt/kafka/secrets/migration.properties

    worker:
      url: http://db-insert-worker:8080   # gitops apps/db-insert-worker 의 Service 이름
      state_dir: /var/lib/worker

    cutover:
      state_dir: /var/lib/worker
      min_live_rows_after_snapshot: 100
      min_rows_after_switch: 100
      offset_stable_seconds: 10
      poll_interval_seconds: 5
      stage_timeout_seconds: 1800

    # 접수 서비스(durable-ingress) 자동 제어. FENCING 에서 큐 pause(settled), SWITCHING 에서 대상 앱
    # readiness 확인 뒤 /target → /resume. 이 절을 지우면 예전처럼 운영자가 port-forward 로 수동 제어한다.
    ingress:
      control_url: http://durable-ingress-control.hackathon.svc.cluster.local:9092
      token_env: INGRESS_CONTROL_TOKEN      # runner.yaml 의 Secret durable-ingress-control (optional)
      targets:
        # job 의 target 이름 → INGRESS_TARGETS 의 이름 (apps/durable-ingress/ingress.yaml)
        onprem_return: onprem               # 온프렘 sample-app (migration_demo_return)
        aws: aws_db                         # 온프렘 sample-app-rds 프로세스 (RDS migration_demo)
      app_checks:
        aws:
          url: http://sample-app-rds.hackathon.svc.cluster.local
          database: migration_demo          # /api/info database.name. writes_paused=false 여야 큐를 돌린다

  # 리허설용. 위 config.yaml 과 targets 는 같고 job 만 onprem → rehearsal (job_id rehearsal_001,
  # slot rehearsal_001, publication rehearsal_001_pub, topic rehearsal_001.public.migration_demo).
  # 워커 파드에서 `--config /etc/migration/config.rehearsal.yaml` 로 init_db·cdc·cutover·verify 를 돌린다.
  # 귀환 전환용. 워커 파드에서 kubectl exec 로
  # python -m migration.cutover|verify --config /etc/migration/config.return.yaml 실행.
  # 관리자 비밀번호(MIGRATION_ADMIN_PASSWORD, MIGRATION_AWS_ADMIN_PASSWORD)는 실행 시 환경변수로만. 반영 후 워커 재시작 필요.
  # verify 단계가 migration_verify 로 접속하므로 MIGRATION_VERIFY_PASSWORD 도 함께 준다 (워커 파드 env 에 없다).
  # 내용은 apps/migration-return/configmap.yaml 의 config.yaml 과 같게 유지한다.

  config.return-durable.yaml: |
    targets:
      onprem:
        host: postgres
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      onprem_return:
        host: postgres
        port: 5432
        dbname: migration_demo_return
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      rehearsal:
        host: postgres
        port: 5432
        dbname: migration_demo_rehearsal
        sslmode: require
        admin_dbname: postgres
        kind: self_managed
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      aws:
        host: oneaction-review-db.cdb6j7l51obe.ap-northeast-2.rds.amazonaws.com
        kind: rds
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_AWS_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
    job:
      job_id: durable_return_001
      source: aws
      target: onprem_return
      table: public.migration_demo
      live_phase_before: aws_live
      live_phase_after: onprem_return_live
    kafka:
      bootstrap_servers: kafka:9092
      connect_url: http://migration-connect:8083
      secrets_file: /opt/kafka/secrets/migration.properties
    worker:
      url: http://db-insert-worker:8080
      state_dir: /var/lib/worker
    cutover:
      state_dir: /var/lib/worker
      min_live_rows_after_snapshot: 100
      min_rows_after_switch: 100
      offset_stable_seconds: 10
      poll_interval_seconds: 5
      stage_timeout_seconds: 1800

  # 리허설(AWS 없이): 현재 라이브 DB(onprem_return)에서 같은 Postgres 의 migration_demo_rehearsal 로
  # 워커·CDC·DB 권한·접수 큐를 cutover 도구가 전부 자동으로 넘긴다. 러너 파드에서
  #   python -m migration.cutover --config /etc/live-cutover/config.rehearsal-durable.yaml --state-dir /var/lib/worker run
  # 전제: migration_demo_rehearsal 은 비어 있어야 한다(11-05 rehearsal_001 잔존 행은 먼저 비운다).
  # 되돌리기: 리허설 뒤 라이브를 onprem_return 으로 되돌리려면 접수 서비스 /target onprem 과 원본 GRANT 를
  # 운영자가 되돌린다(리허설 중 리허설 DB 에 들어간 합성 행은 그대로 둔다).
  config.rehearsal-durable.yaml: |
    targets:
      onprem:
        host: postgres
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      onprem_return:
        host: postgres
        port: 5432
        dbname: migration_demo_return
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      rehearsal:
        host: postgres
        port: 5432
        dbname: migration_demo_rehearsal
        sslmode: require
        admin_dbname: postgres
        kind: self_managed
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
      aws:
        host: oneaction-review-db.cdb6j7l51obe.ap-northeast-2.rds.amazonaws.com
        kind: rds
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_AWS_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD
    job:
      job_id: rehearsal_durable_002   # _001 은 2026-11-07 옛 러너 이미지(접수 제어 없음)로 NEEDS_RECOVERY, 원복 완료
      source: onprem_return
      target: rehearsal
      table: public.migration_demo
      live_phase_before: onprem_return_live
      live_phase_after: rehearsal_live
    kafka:
      bootstrap_servers: kafka:9092
      connect_url: http://migration-connect:8083
      secrets_file: /opt/kafka/secrets/migration.properties
    worker:
      url: http://db-insert-worker:8080
      state_dir: /var/lib/worker
    cutover:
      state_dir: /var/lib/worker
      min_live_rows_after_snapshot: 100
      min_rows_after_switch: 100
      offset_stable_seconds: 10
      poll_interval_seconds: 5
      stage_timeout_seconds: 1800
    ingress:
      control_url: http://durable-ingress-control.hackathon.svc.cluster.local:9092
      token_env: INGRESS_CONTROL_TOKEN
      targets:
        onprem_return: onprem               # 온프렘 sample-app (migration_demo_return)
        rehearsal: rehearsal                # 온프렘 sample-app-rehearsal (migration_demo_rehearsal)
      app_checks:
        rehearsal:
          url: http://sample-app-rehearsal.hackathon.svc.cluster.local
          database: migration_demo_rehearsal

  # 온프렘→AWS 이전 리허설(rehearsal_forward_001). 위 config.yaml 과 targets·kafka·worker·cutover·ingress 는 같고
  # job 만 다르다 (slot rehearsal_forward_001, publication rehearsal_forward_001_pub, 커넥터 rehearsal_forward_001-source/-sink,
  # 토픽 rehearsal_forward_001.public.migration_demo). 접수 큐는 ingress 절로 cutover 가 자동 제어한다. 러너 파드에서
  #   python -m migration.cutover --config /etc/live-cutover/config.rehearsal-forward.yaml --state-dir /var/lib/worker run
  config.rehearsal-forward.yaml: |
    targets:
      onprem:
        host: postgres            # k3s 네임스페이스 hackathon 안의 기존 플랫폼 Postgres 16
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres    # CREATE DATABASE 용 유지보수 DB
        users:
          admin:
            # 기존 플랫폼 Postgres 의 슈퍼유저. Secret review-db-credentials 의 username 과 같다.
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      onprem_return:
        # AWS→온프렘 귀환 대상. 정방향 원본(migration_demo)과 같은 인스턴스의 분리된 빈 DB.
        # 귀환 cutover 가 워커 /target 으로 이 이름을 보내므로 여기 없으면 SWITCHING 에서 NEEDS_RECOVERY 가 된다.
        host: postgres
        port: 5432
        dbname: migration_demo_return
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      rehearsal:
        # AWS 가 없을 때 전체 사이클(CDC → Sink → 전환 → 검증)을 돌리는 리허설 대상.
        # 정방향 원본과 같은 인스턴스의 분리된 빈 DB. RDS 가 생기면 aws 로 같은 절차를 반복한다.
        host: postgres
        port: 5432
        dbname: migration_demo_rehearsal
        sslmode: require
        admin_dbname: postgres
        kind: self_managed
        users:
          admin:
            user: oneaction_admin
            password_env: MIGRATION_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

      aws:
        # 미확정. oneaction-infra 가 RDS 주소를 정하면 바꾼다 (k3s→AWS 사설 경로도 그때 확정).
        host: oneaction-review-db.cdb6j7l51obe.ap-northeast-2.rds.amazonaws.com
        kind: rds                 # RDS: REPLICATION 속성 대신 rds_replication 역할. init_db·cutover 가 참고한다
        port: 5432
        dbname: migration_demo
        sslmode: require
        admin_dbname: postgres
        users:
          admin:
            user: oneaction_admin     # oneaction-infra RDS 마스터 계정
            password_env: MIGRATION_AWS_ADMIN_PASSWORD
          app:
            user: migration_app
            password_env: MIGRATION_APP_PASSWORD
          cdc:
            user: migration_cdc
            password_env: MIGRATION_CDC_PASSWORD
          sink:
            user: migration_sink
            password_env: MIGRATION_SINK_PASSWORD
          verify:
            user: migration_verify
            password_env: MIGRATION_VERIFY_PASSWORD

    job:
      job_id: rehearsal_forward_001    # 2026-11-07 온프렘→AWS 이전 리허설. 이전 job 의 checkpoint·offset 을 재사용하지 않는다
      source: onprem_return            # 현재 라이브 DB (migration_demo_return)
      target: aws
      table: public.migration_demo
      live_phase_before: onprem_return_live
      live_phase_after: aws_live

    kafka:
      bootstrap_servers: kafka:9092       # 기존 플랫폼 Kafka 3.9.1, PLAINTEXT
      connect_url: http://migration-connect:8083
      # 커넥터 비밀번호는 Connect 의 EnvVarConfigProvider(${env:MIGRATION_*_PASSWORD})로 주입한다.
      # gitops apps/migration-cdc 가 config.providers=env 와 Secret 환경변수를 설정한다.
      # secrets_file 은 FileConfigProvider 를 쓰는 환경을 위한 선택값이며 기본 템플릿은 쓰지 않는다.
      secrets_file: /opt/kafka/secrets/migration.properties

    worker:
      url: http://db-insert-worker:8080   # gitops apps/db-insert-worker 의 Service 이름
      state_dir: /var/lib/worker

    cutover:
      state_dir: /var/lib/worker
      min_live_rows_after_snapshot: 100
      min_rows_after_switch: 100
      offset_stable_seconds: 10
      poll_interval_seconds: 5
      stage_timeout_seconds: 1800

    # 접수 서비스(durable-ingress) 자동 제어. FENCING 에서 큐 pause(settled), SWITCHING 에서 대상 앱
    # readiness 확인 뒤 /target → /resume. 이 절을 지우면 예전처럼 운영자가 port-forward 로 수동 제어한다.
    ingress:
      control_url: http://durable-ingress-control.hackathon.svc.cluster.local:9092
      token_env: INGRESS_CONTROL_TOKEN      # runner.yaml 의 Secret durable-ingress-control (optional)
      targets:
        # job 의 target 이름 → INGRESS_TARGETS 의 이름 (apps/durable-ingress/ingress.yaml)
        onprem_return: onprem               # 온프렘 sample-app (migration_demo_return)
        aws: aws_db                         # 온프렘 sample-app-rds 프로세스 (RDS migration_demo)
      app_checks:
        aws:
          url: http://sample-app-rds.hackathon.svc.cluster.local
          database: migration_demo          # /api/info database.name. writes_paused=false 여야 큐를 돌린다
