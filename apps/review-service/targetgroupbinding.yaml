# 플랫폼 ALB(oneaction-alb) → platform-tg → Service platform:8080.
# 인프라 EKS_HANDOFF.md 의 예시와 같다. 타깃 그룹은 Terraform alb 스택 소유 — LBC 는 타깃(파드 IP) 등록만 한다.
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: platform
spec:
  serviceRef:
    name: platform
    port: 8080
  targetGroupARN: arn:aws:elasticloadbalancing:ap-northeast-2:974402993422:targetgroup/platform-tg/1927d0766890f375
  targetType: ip
