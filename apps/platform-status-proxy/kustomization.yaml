# Oneport 플랫폼(AWS EKS) 수집기용 읽기 전용 상태 프록시 (온프렘 k3s, hackathon 네임스페이스).
# Argo CD Application: argocd/onprem/platform-status-proxy.yaml
# 플랫폼 설정(Hackathon platform/deploy/aws/fleet.json):
#   worker_url  = http://172.30.1.10:30880/worker,http://172.30.1.7:30880/worker
#   connect_url = http://172.30.1.10:30880/connect,http://172.30.1.7:30880/connect
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackathon
labels:
  - pairs: {app.kubernetes.io/part-of: oneport-platform}
    includeSelectors: false
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: platform-status-proxy
    files: [nginx.conf]
