apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-status-proxy
  labels:
    app.kubernetes.io/name: platform-status-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-status-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-status-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: platform-status-proxy
            items: [{key: nginx.conf, path: default.conf}]
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
