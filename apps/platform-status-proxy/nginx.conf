# 읽기 전용 상태 프록시. Oneport 플랫폼 수집기가 쓰는 GET 두 가지만 넘기고 나머지는 모두 막는다.
#   GET /worker/status                               → 410 Gone (INSERT 워커 제거)
#   GET /connect/connectors/<job>-(source|sink)/status → migration-connect:8083/connectors/<...>/status
# 워커의 POST /pause·/resume·/drain·/target, Connect 의 커넥터 생성·삭제·설정 조회는 여기로 닿지 않는다.
upstream connect {
    server migration-connect:8083;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1k;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location = /worker/status {
        limit_except GET { deny all; }
        default_type application/json;
        return 410 '{"detail":"DB insert worker retired; use traffic-bot"}';
    }
    location ~ "^/connect/connectors/([a-z][a-z0-9_]{0,63}-(source|sink))/status$" {
        limit_except GET { deny all; }
        proxy_pass http://connect/connectors/$1/status;
        proxy_set_header Host migration-connect;
        proxy_read_timeout 5s;
    }
    location / {
        return 404;
    }
}
