apiVersion: v1
kind: Service
metadata:
  name: durable-ingress
spec:
  selector: {app: durable-ingress}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
# Control API for the cutover runner only. NetworkPolicy durable-ingress-control limits 9092 to
# the runner/worker pods; INGRESS_CONTROL_TOKEN (Secret durable-ingress-control) adds a bearer check.
apiVersion: v1
kind: Service
metadata:
  name: durable-ingress-control
spec:
  selector: {app: durable-ingress}
  ports: [{name: control, port: 9092, targetPort: 9092}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: durable-ingress
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: durable-ingress}
  template:
    metadata:
      labels: {app: durable-ingress}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ingress
          image: docker.io/kty1021/sample-app
          command: [node, src/durable-ingress/server.js]
          env:
            - name: REDIS_URL
              value: redis://durable-ingress-redis:6379
            # aws_db is an onprem application process connected to AWS RDS.
            # rehearsal is an onprem application process on the same Postgres (migration_demo_rehearsal),
            # used to exercise the automatic cutover without touching AWS.
            # Tokens must be Secret env references, never literals in this JSON.
            - name: INGRESS_TARGETS
              value: '{"onprem":{"url":"http://sample-app.hackathon.svc.cluster.local"},"aws_db":{"url":"http://sample-app-rds.hackathon.svc.cluster.local"},"rehearsal":{"url":"http://sample-app-rehearsal.hackathon.svc.cluster.local"},"aws_eks":{"url":"https://sample-app.hackerthon.yubin.dev","token_env":"EKS_REQUEST_API_TOKEN"}}'
            - name: EKS_REQUEST_API_TOKEN
              valueFrom:
                secretKeyRef: {name: sample-app-eks-api-token, key: token}
            # cutover (migration.cutover, ingress 절) 가 큐를 pause/target/resume 한다.
            # 수동 운영(port-forward 9092)도 그대로 가능하다.
            - name: INGRESS_CONTROL_HOST
              value: "0.0.0.0"
            - name: INGRESS_CONTROL_TOKEN
              valueFrom:
                secretKeyRef: {name: durable-ingress-control, key: token, optional: true}
          ports:
            - {name: http, containerPort: 8080}
            - {name: control, containerPort: 9092}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
