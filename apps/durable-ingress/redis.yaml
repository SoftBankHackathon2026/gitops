apiVersion: v1
kind: Service
metadata:
  name: durable-ingress-redis
spec:
  selector: {app: durable-ingress-redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: durable-ingress-redis
spec:
  serviceName: durable-ingress-redis
  replicas: 1
  selector:
    matchLabels: {app: durable-ingress-redis}
  template:
    metadata:
      labels: {app: durable-ingress-redis}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
          command: [redis-server]
          args: [--appendonly, 'yes', --appendfsync, always, --maxmemory, 384mb, --maxmemory-policy, noeviction]
          ports: [{containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
          livenessProbe:
            exec: {command: [redis-cli, ping]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
