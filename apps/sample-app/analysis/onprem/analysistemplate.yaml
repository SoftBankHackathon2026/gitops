# 온프렘 k3s 용 canary 분석. web 프로바이더는 argo-rollouts 컨트롤러 파드가 직접 HTTP 를 호출하는데,
# 이 클러스터에서는 컨트롤러(k3s-master)에서 ClusterIP 로 가는 연결이 거부돼 분석이 Error 로 끝났다
# (2026-11-05 revision 2 abort). 그래서 검사를 hackathon 네임스페이스 안의 Job 으로 돌린다.
# 검사 내용은 같다: Service 를 거쳐 /api/info 가 200 이고 app 필드가 sample-app 인지.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: sample-app-health
spec:
  args:
    - name: canary-hash
  metrics:
    - name: api-ok
      count: 3
      interval: 10s
      failureLimit: 1
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 60
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  runAsGroup: 101
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: check
                    image: curlimages/curl:8.11.1
                    command:
                      - sh
                      - -c
                      - |
                        set -eu
                        body=$(curl -fsS --max-time 5 http://sample-app.hackathon.svc.cluster.local/api/info)
                        echo "$body" | head -c 300; echo
                        echo "$body" | grep -q '"app":"sample-app"'
                    resources:
                      requests: {cpu: 10m, memory: 16Mi}
                      limits: {cpu: 100m, memory: 64Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: [ALL]
