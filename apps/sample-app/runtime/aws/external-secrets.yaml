apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: sample-app
  namespace: sample-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-app-db
  namespace: sample-app
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: sample-app
  target:
    name: sample-app-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: database-url
    remoteRef:
      key: oneaction/sample-app
      property: database_url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-app-api-token
  namespace: sample-app
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: sample-app
  target:
    name: sample-app-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: token
    remoteRef:
      key: oneaction/sample-app
      property: request_api_token
