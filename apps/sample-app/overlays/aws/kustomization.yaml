# Team Ghost finals: maintained here; no legacy review-service renderer required.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app
resources:
  - ../../base
  - ingress.yaml
patches:
  - target:
      kind: Rollout
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: DEPLOY_ENV
            value: aws
          - name: DEPLOY_REGION
            value: ap-northeast-2
          - name: PGSSLMODE
            value: verify-full
          - name: PGSSLROOTCERT
            value: /db-ca/ca.pem
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: sample-app-db
                key: database-url
          - name: FAIL_RATE
            value: '0'
          - name: APP_CONTROL_FILE
            value: /app-control/control.json
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /readyz
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: db-ca
          mountPath: /db-ca
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: db-ca
          secret:
            secretName: sample-app-db-ca
      - op: add
        path: /spec/template/spec/terminationGracePeriodSeconds
        value: 30
