# 손 파일 — 렌더러는 overlays/aws 만 만든다 (명세 하나 = 환경 하나, sample-app 명세는 aws).
#
# GKE oneaction-dev 에는 Argo Rollouts 가 없어 base 의 Rollout 을 Deployment 로 바꿔 배포한다.
# 카나리·블루그린 시연은 온프렘과 AWS 에서 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app
resources:
  - ../../base
  - serviceaccount.yaml
patches:
  # Service 를 HTTP 로 공개한다.
  - path: service-public.yaml
  - target:
      kind: Rollout
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: DEPLOY_ENV
            value: gcp
          - name: DEPLOY_REGION
            value: asia-northeast3
          # Secret sample-app-db 는 이 overlay 밖에서 준비한다. 값은
          # postgres://<앱 계정>:<비밀번호>@127.0.0.1:5432/migration_demo 형식이다.
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: sample-app-db
                key: database-url
          # 앱과 프록시 사이의 loopback 구간만 평문이다. 프록시가 Cloud SQL 까지 암호화한다.
          - name: PGSSLMODE
            value: disable
          - name: APP_CONTROL_FILE
            value: /app-control/control.json
          - name: REQUEST_API_AUTH
            value: required
          - name: REQUEST_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: sample-app-api-token
                key: token
                optional: true
      # 앱은 어떤 TLS 모드에서도 호스트 이름까지 검증하는데, Cloud SQL 은 사설 IP 로만
      # 열려 있어 직접 접속 대신 Auth Proxy 를 쓴다. 앱은 시작할 때 스키마를 만들지 않는다.
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: sample-app
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
          args:
            - --private-ip
            - --address=127.0.0.1
            - --port=5432
            - ghost-project-513812:asia-northeast3:oneaction-dev-review
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      # Rollout 전용 필드를 빼고 일반 Deployment 로 바꾼다.
      - op: remove
        path: /spec/progressDeadlineAbort
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
      - op: replace
        path: /apiVersion
        value: apps/v1
      - op: replace
        path: /kind
        value: Deployment
