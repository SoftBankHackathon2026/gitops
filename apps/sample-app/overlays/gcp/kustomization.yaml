# 손 파일 — 렌더러는 overlays/aws 만 만든다 (명세 하나 = 환경 하나, sample-app 명세는 aws).
#
# GCP 만 블루그린으로 배포한다. base 의 canary 를 통째로 바꾼다.
# 🔴 GCP Application 을 처음 적용하기 전에 머지돼야 한다. canary 로 먼저 뜬 Rollout 을
# blueGreen 으로 바꾸면 SkipSteps 문제가 생긴다 — 처음부터 blueGreen 으로 생성되게 한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app
resources:
  - ../../base
  - service-preview.yaml
  - serviceaccount.yaml
patches:
  # active Service만 HTTP로 공개한다. preview와 Rollouts의 selector 관리는 유지한다.
  - path: service-public.yaml
  - target:
      kind: Rollout
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: DEPLOY_ENV
            value: gcp
          - name: DEPLOY_REGION
            value: asia-northeast3
          # Secret sample-app-db 는 이 overlay 밖에서 준비한다. 값은
          # postgres://<앱 계정>:<비밀번호>@127.0.0.1:5432/migration_demo 형식이다.
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: sample-app-db
                key: database-url
          # 앱과 프록시 사이의 loopback 구간만 평문이다. 프록시가 Cloud SQL 까지 암호화한다.
          - name: PGSSLMODE
            value: disable
          - name: APP_CONTROL_FILE
            value: /app-control/control.json
          - name: REQUEST_API_AUTH
            value: required
          - name: REQUEST_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: sample-app-api-token
                key: token
                optional: true
      # 앱은 어떤 TLS 모드에서도 호스트 이름까지 검증하는데, Cloud SQL 은 사설 IP 로만
      # 열려 있어 직접 접속 대신 Auth Proxy 를 쓴다. 앱은 시작할 때 스키마를 만들지 않는다.
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: sample-app
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
          args:
            - --private-ip
            - --address=127.0.0.1
            - --port=5432
            - ghost-project-513812:asia-northeast3:oneaction-dev-review
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      # 🔴 수동 승격이다 (2026-10-10 팀 합의, 박찬건 19:51 확인).
      #
      # autoPromotionEnabled: false 면 그린이 Ready 된 뒤 **사람이 승격할 때까지 멈춘다.**
      # 데모 시나리오의 관문 ② 가 이것이다 — "사람이 확인한 뒤 한 번에 바꿉니다".
      # 다이어그램 CI/CD 탭의 "스키마 변경 있음: 블루그린 + 수동 승격" 과도 맞는다.
      #
      # autoPromotionSeconds 는 넣지 않는다. enabled 가 false 면 쓰이지 않아서
      # 남겨두면 "30초 뒤 자동" 으로 읽히는 오해만 만든다.
      #
      # 승격 방법: Argo CD UI 의 Rollout 에서 Promote, 또는
      #   kubectl argo rollouts promote sample-app -n sample-app
      #
      # ⚠️ 멈춰 있는 동안 active(sample-app)는 옛 버전, preview(sample-app-preview)는
      # 새 버전을 가리킨다. 10/10 실측으로 확인했다.
      - op: replace
        path: /spec/strategy
        value:
          blueGreen:
            activeService: sample-app
            previewService: sample-app-preview
            autoPromotionEnabled: false
            scaleDownDelaySeconds: 30
