# 온프렘 k3s(oneport-onprem) 의 hackathon 네임스페이스용 overlay.
#
# 2026-11-03 까지는 Argo CD 에 손으로 등록한 Application(hackathon-sample-app)이
# base 를 직접 가리키고 인라인 kustomize 패치로 같은 내용을 넣고 있었다.
# 그 패치를 저장소 파일로 옮긴 것이다 — argocd/onprem/sample-app.yaml 이 가져간다.
#
# overlays/local 과 다른 점
#   - 네임스페이스가 sample-app 이 아니라 hackathon 이다 (AppProject hackathon 이 hackathon 만 허용).
#   - Ingress 가 없다. 온프렘 클러스터에서는 클러스터 안 Service 로만 본다.
# 🔴 AnalysisTemplate 은 여기 없다. ../../analysis/onprem 을 Application 의 두 번째 소스로 가져간다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackathon
resources:
  - ../../base
  - service-canary.yaml
patches:
  - target:
      kind: Rollout
      name: sample-app
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          ghost.dev/analysis-retry: "2026-11-07-connection-retry"
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: DEPLOY_ENV
            value: onprem
          - name: DEPLOY_REGION
            value: onprem-k3s
          # 플랫폼 Postgres 는 pg_hba 가 hostssl 만 허용하고 self-signed 인증서(SAN: postgres,
          # postgres.hackathon.svc.cluster.local)를 쓴다. 앱의 require 도 인증서를 검증하므로
          # verify-full + 서버 인증서를 CA 로 준다 (Secret sample-app-db-ca, key ca.pem = postgres-tls 의 tls.crt).
          - name: PGSSLMODE
            value: verify-full
          - name: PGSSLROOTCERT
            value: /db-ca/ca.pem
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: sample-app-db
                key: database-url
          - name: FAIL_RATE
            value: '0'
          - name: APP_CONTROL_FILE
            value: /app-control/control.json
          # Secret 이 없으면 pod 는 뜨고 /api/requests 만 503 으로 닫힌다.
          # 온프렘은 ClusterIP 만 있고 공개 진입점이 없다. 트래픽 봇이 http://sample-app.svc 로 붙어야 하는데
          # 봇은 토큰이 있으면 https 가 아닌 진입점을 거절하므로(INSECURE_TOKEN_TRANSPORT) 온프렘은 open 으로 둔다.
          # 공개 진입점(HTTPS)이 생기면 required + sample-app-api-token 으로 되돌린다.
          - name: REQUEST_API_AUTH
            value: optional
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /readyz
      # 분석 Job 이 카나리 파드만 검사하도록 canaryService 를 지정한다 (service-canary.yaml).
      - op: add
        path: /spec/strategy/canary/canaryService
        value: sample-app-canary
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: db-ca, mountPath: /db-ca, readOnly: true}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: db-ca
          secret:
            secretName: sample-app-db-ca
            items:
              - {key: ca.pem, path: ca.pem}
