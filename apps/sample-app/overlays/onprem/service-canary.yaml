# 카나리 파드만 고르는 Service. Rollout 의 canaryService 로 지정하면 Argo Rollouts 가
# selector 에 현재 카나리 ReplicaSet 의 pod-template-hash 를 덧붙인다.
# 분석 Job 이 stable 과 섞인 sample-app Service 대신 이 Service 를 검사해 카나리만 판정한다.
apiVersion: v1
kind: Service
metadata:
  name: sample-app-canary
  labels:
    app: sample-app
spec:
  selector:
    app: sample-app
  ports:
    - port: 80
      targetPort: 8080
