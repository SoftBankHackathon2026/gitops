# 홈랩 sample-app 공개 진입점. 홈랩 Traefik 의 web(80) 으로 받는다.
# 밖에서는 플랫폼 서버(도쿄) Caddy 가 HTTPS 를 끝내고 Tailscale 로 이 호스트를 그대로 넘긴다
# (Hackathon 저장소 platform/deploy/ec2/README.md "홈랩 앱을 밖에 열기"). 도메인 A 레코드는 플랫폼 서버 고정 IP 다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app
spec:
  ingressClassName: traefik
  rules:
    - host: sample-app.onprem.yubin.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-app
                port:
                  number: 80
