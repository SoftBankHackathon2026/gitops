apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app
resources:
  - ../../base
  - ingress.yaml
patches:
  - target:
      kind: Rollout
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: DEPLOY_ENV
            value: local
          - name: DEPLOY_REGION
            value: busan-local
          - name: PGSSLMODE
            value: disable
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: sample-app-db
                key: database-url
          - name: FAIL_RATE
            value: '0'
          - name: APP_CONTROL_FILE
            value: /app-control/control.json
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /readyz
