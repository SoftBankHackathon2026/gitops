# Opt-in AWS preparation graph. Default argocd/ remains unchanged.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../argocd
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: sample-app-aws
    patch: |-
      - op: replace
        path: /spec/sources/0/path
        value: apps/sample-app/runtime/full-aws
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: service-migration-aws
    patch: |-
      - op: replace
        path: /spec/source/path
        value: apps/service-migration-aws-active
