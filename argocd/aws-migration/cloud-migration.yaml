apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-migration-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SoftBankHackathon2026/gitops.git
    targetRevision: main
    path: apps/cloud-migration-aws
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-migration
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
