# Not included in root until this exact GKE cluster is registered with Argo CD.
# Do not use tokyo-gke: that older registration points to another project/account.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-migration-gcp-edge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SoftBankHackathon2026/gitops.git
    targetRevision: main
    path: apps/cloud-migration-gcp-edge
  destination:
    server: https://34.50.37.147
    namespace: sample-app
  syncPolicy:
    automated: {prune: false, selfHeal: true}
