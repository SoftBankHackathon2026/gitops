apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-service-migration
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.12.0
    helm:
      releaseName: external-secrets-service-migration
      valuesObject:
        installCRDs: false
        replicaCount: 1
        image:
          tag: v2.12.0
        revisionHistoryLimit: 3
        leaderElect: false
        leaderElectionID: external-secrets-service-migration-controller
        scopedNamespace: service-migration
        scopedRBAC: true
        serviceAccount:
          create: true
          name: external-secrets-service-migration
          annotations: {}
        rbac:
          create: true
          leaderElection:
            create: false
          serviceAccountTokenCreate: false
          servicebindings:
            create: false
          aggregateToView: false
          aggregateToEdit: false
          aggregateToAdmin: false
        systemAuthDelegator: false
        processClusterStore: false
        processClusterExternalSecret: false
        processClusterPushSecret: false
        processClusterGenerator: false
        processPushSecret: false
        crds:
          createClusterExternalSecret: false
          createClusterSecretStore: false
          createClusterGenerator: false
          createClusterPushSecret: false
          createPushSecret: false
          conversion:
            enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        extraEnv:
        - name: AWS_REGION
          value: ap-northeast-2
        - name: AWS_STS_REGIONAL_ENDPOINTS
          value: regional
        webhook:
          create: false
        certController:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
